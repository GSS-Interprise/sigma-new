<!doctype html>
<!-- lang pt-BR + translate="no": com lang="en" o Chrome oferecia traduzir a página; o Google Tradutor
     troca os textos por <font> e o React quebra com "removeChild: not a child of this node" (datepickers, modais). -->
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Endereço antigo (23/11/2026): quem abre sigma-gss.lovable.app vai para o domínio novo, no mesmo caminho
         (links /nf/... gravados no modelo da Meta continuam valendo). Só o host publicado: a prévia do editor do
         Lovable (id-preview--*.lovable.app, *.lovableproject.com) continua funcionando. -->
    <script>
      if (location.hostname === "sigma-gss.lovable.app") {
        location.replace("https://sigma.gestaoservicosaude.com.br" + location.pathname + location.search + location.hash);
      }
    </script>
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sigma · GSS</title>
    <meta name="description" content="Escalas, prospecção de médicos, contratos e financeiro da GSS num lugar só.">
    <meta name="author" content="GSS" />

    <!-- PWA / Web Push (notificações no celular) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1c2e4a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sigma" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    
    
    <!-- Preview de link (WhatsApp, e-mail, redes). Imagens no próprio repositório (public/), não mais no armazenamento do
         Lovable. Imagem: 1200x630, feita em 16/11/2026 com a marca da GSS. -->
    <link rel="icon" type="image/jpeg" href="/logo-gss.jpeg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sigma · GSS" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://sigma.gestaoservicosaude.com.br/" />
    <meta property="og:title" content="Sigma · GSS" />
    <meta property="og:description" content="Escalas, prospecção de médicos, contratos e financeiro da GSS num lugar só." />
    <meta property="og:image" content="https://sigma.gestaoservicosaude.com.br/og-sigma.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sigma, sistema da GSS Gestão de Serviços de Saúde" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sigma · GSS" />
    <meta name="twitter:description" content="Escalas, prospecção de médicos, contratos e financeiro da GSS num lugar só." />
    <meta name="twitter:image" content="https://sigma.gestaoservicosaude.com.br/og-sigma.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
